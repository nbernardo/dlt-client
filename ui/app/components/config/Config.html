<st-element component="Header" proxy="headerProxy" showLogsIcon="false"></st-element>

<div class="config-comp-panel-container">
	<header class="header">
		<h1 class="header-title">Admin Panel</h1>
		<p class="header-subtitle">Alias your namespace and add new users.</p>
	</header>
	<div class="panel-content">
		<div class="form-section">

			<div class="space-y-3">
				<h2 class="form-title">User token:</h2>
				<div style="display: flex; gap: 7px; align-items: center; margin-top: 6px;">
					<i 
						onclick="component.copyTokenToClipboard()"
						class="fa fa-copy clipboard-copy-icon" style="color: rgb(99, 98, 98); float: left;"></i>
					<div class="truncate-text">@userToken</div>
				</div>
			</div>

			<br>

			<div class="space-y-3">
				<h2 class="form-title">Rename Namespace/Tenant</h2>
				<form>
					<div>
						<label for="namespace" class="form-label">Namespace Name</label>
						<input type="text" id="namespace" name="namespace" class="form-input"
							placeholder="e.g., Marketing-Team-Files" required>
					</div>
					<div class="form-group">
						<button type="submit" disabled class="btn btn-primary">
							Add Namespace alias
						</button>
					</div>
				</form>
			</div>

			<hr>

			<div class="space-y-3">
				<h2 class="form-title">Landing zone</h2>
				<form>
					<div>
						<label for="email" class="form-label">Folder Path</label>
						<div style="display: flex; gap: 3px;">
							<input (value)="landingZonePath"
								class="form-input" placeholder="e.g., /home/user-name/folder-name" required style="flex: 2;">
							<button type="button" onclick="component.checkPath()" class="btn btn-secondary" style="flex: 0.2;">Save</button>
						</div>
					</div>
				</form>
				<div style="max-height: 200px; overflow-y: auto; width: 100%;">
					<table style="width: 100%; margin-top: 10px; border-collapse: collapse; table-layout: fixed;">
						<thead style="position: sticky; top: 0; background-color: white; z-index: 1;">
							<tr style="text-align: left;">
								<th style="width: 60%;">File name</th>
								<th style="width: 25%;">Type</th>
								<th style="width: 15%;">Size</th>
							</tr>
						</thead>
						<tbody (forEach)="landingZoneFiles">
							<tr each="item">
								<td name="{item.name}"
									style="width: 60%;" class="text-shrinked">{item.name}</td>
								<td style="width: 25%;" class="text-shrinked">{item.type}</td>
								<td style="width: 15%;" class="text-shrinked">{item.size} {item.unit}</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
		<div class="chart-section">
			<h2 class="form-title">Namespace Overview</h2>
			<p class="header-subtitle" style="margin-bottom: 1.5rem;">
				Metrics and activity.
			</p>
			<div style="display: flex; flex-direction: row; gap: 1.5rem;">
				<div>
					<h3 class="chart-title">Schedule vs Created Pipelines</h3>
					<canvas id="pipelineChart" class="chart-canvas"></canvas>
				</div>
				<!-- <div>
					<h3 class="chart-title">Total ingested records</h3>
					<canvas id="recordsIngestion" class="chart-canvas">Will hold the chart with ingested records</canvas>
				</div> -->
			</div>
		</div>
	</div>
</div>
