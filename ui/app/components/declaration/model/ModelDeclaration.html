<style>

:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #f8f9fa;
  --color-border-secondary: #d0d7de;
  --color-border-tertiary: #e1e4e8;
  --color-text-primary: #1f2328;
  --color-text-secondary: #656d76;
  --color-brand-primary: #2c3e50;
  --color-brand-hover: #163351;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
  --border-radius-md: 6px;
  --border-radius-lg: 8px;
}

/* Top Header */
.app-header { background: var(--color-brand-primary); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.app-header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }

/* Main Workbench */
.workbench { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; flex: 1; overflow: hidden; height: 83%; }

/* Custom Panels */
.panel { display: flex; flex-direction: column; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; }
.panel-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); font-weight: 600; font-size: 13px; color: var(--color-text-primary); }

/* UI Elements */
.btn { padding: 5px 12px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--color-background-secondary); }
.btn-primary { background: var(--color-brand-primary); color: #fff; border-color: var(--color-brand-primary); width: 90px; }
.btn-primary:hover { background: var(--color-brand-hover); }

.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.badge-teal { background: #E1F5EE; color: #085041; }

/* Text Editors & Code Output */
textarea { flex: 1; width: 100%; padding: 14px; border: none; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; color: var(--color-text-primary); background: var(--color-background-primary); outline: none; resize: none; }
.sql-output { flex: 1; margin: 0; padding: 14px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; color: #1E242B; background: #F4F6F8; border-top: 0.5px solid var(--color-border-tertiary); overflow-y: auto; white-space: pre-wrap; }

.error-banner { background: #FCEBEB; color: #A32D2D; padding: 10px 16px; font-size: 12px; font-weight: 500; border-bottom: 0.5px solid var(--color-border-tertiary); display: none; line-height: 1.5; }
#yaml-input { width: 100%; height: 100%; }
.model-declaration-stretch { height: stretch !important; }
</style>

<div class="componentui-main-container declarations-ui @cmpInternalId">

	<nav class="tabs shared-tab-navigation">
		<div class="tab active" onclick="component.switchTab(this, 'regular-model')">
			<img src="/app/assets/imgs/3d.png" alt="">
			$bundle.dataModelTab
		</div>
		<div class="tab" onclick="component.switchTab(this, 'quality-model')">
			<img src="/app/assets/imgs/rule.png" alt="">
			$bundle.dataQualityTab
		</div>
	</nav>
	<st-loader (showIf)="self.loadingDQ" (label)="Loading Data Quality UI"/>

	<div (showIf)="!self.loadingDQ" class="model-declaration-section model-declaration-stretch">
		<div style="height: stretch;" id="sec-regular-model" class="section active">
	
			<div class="app-header" style="display: flex; height: 40px;">
			  <h1 style="color: white; margin-bottom: 0;">YAML Model Declaration</h1>
			  <span class="badge badge-teal">Composed Measures v0.1</span>
			</div>
			
			<div id="error-box" class="error-banner"></div>
			
			<div class="workbench">
			  <!-- YAML EDITOR -->
			  <div class="panel">
				<div class="panel-header">
				  <span>1. Declarative Model (YAML)</span>
				  <div style="display: flex; gap: 5px;">
					<form>
						<input type="text" (value)="modelName" placeholder="$bundle.modelNamePholder">
						<button type="button" class="btn" style="width: 62px;" onclick="controller.resetDeclaration(event)">Reset</button>
						<button 
							type="button" disabled class="btn btn-primary save-declaration" 
							style="width: 98px;" onclick="component.saveModel()">
							Save model
						</button>
					</form>
				  </div>
				</div>
				<div id="yaml-input" placeholder="Write your semantic model here..." spellcheck="false"></div>
			  </div>	
			  <!-- COMPILED SQL -->
			  <div class="panel">
				<div class="panel-header">
				  <span>2. Compiled SQL Output</span>
				  <div style="display: flex; gap: 3px;">
					  <button class="btn btn-primary" style="white-space: nowrap;  width: auto;" onclick="component.previewModel()">
						<img src="/app/assets/imgs/database_search.png" style="width: 18px;"> Preview model result
					  </button>
					  <button class="btn btn-primary" onclick="controller.copySQL(event)">Copy SQL</button>
				  </div>
				</div>
				<pre id="sql-output" class="sql-output">-- SQL will generate here automatically</pre>
			  </div>
			</div>
			
		</div>
	</div>

	<div id="sec-quality-model" style="height: stretch; display: none;" class="section">
		<span (showIf)="!self.loadingDQ">
			<div id="sec-quality-model-content"></div>
		</span>
	</div>

</div>
