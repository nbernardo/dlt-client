<div class="@cmpInternalId">
	<div class="pipeline-node-type-minimaze" onclick="controller('WorkSpaceController').handleNodeMinimize(this)">_</div>
	<div class="title-box pipeline-node-type-title-box">
		<div class="node-header-grouper">
			<div class="reload-icon-wrapper">
				<img 
					onclick="component.reloadMe()"
					src="app/assets/imgs/refresh-svgrepo-com.svg" 
					class="reload-loc-node-btn" 
					alt="">
			</div>
			<img src="app/assets/imgs/api-source.svg" width="20">
			@label
		</div>
		<div class="statusicon">@nodeCount</div>
	</div>
	<st-loader 
		small center
		(showIf)="self.showLoading" 
		topPadding="50"
		(label)="Fetching API catalog..."/>
	
	<div class="box @formWrapClass">
		<span (showIf)="!self.showLoading">
			<form (formRef)="formRef" onsubmit="return false;">
				<select (value)="selectedApiType" (required)="true">
					<option value="">Select API type</option>
					<option value="Regular">Regular</option>
					<option value="Hook">Hook</option>
				</select>
			</form>
		</span>
	</div>

	<form (formRef)="formRef" onsubmit="return false;">
		<span (showIf)="self.apiType == 'Hook'">
			<div class="box @formWrapClass inputAPIHook">
				<span class="hook-settings">
					<label>Hook Endpoint &nbsp;<i class="fa fa-copy copy-clipboard" onclick="component.copyUrl()" style="color: grey;"></i></label>
					<input type="text" style="font-size: 10px;" placeholder="Endpoint" (value)="hookEndpoint">					
					<div class="input-endpoint-data">
						<div style="margin-top: 5px;">
							<label>User name</label>
							<input type="text" placeholder="Authentication User" (value)="hookUserName">
						</div>
						<div style="margin-top: 8px;">
							<label>Password</label>
							<input type="password" placeholder="Authentication pass" (value)="hookPassword">
						</div>
					</div>
				</span>
			</div>
		</span>

		<span (showIf)="self.apiType == 'Regular'">
			<div class="box @formWrapClass inputAPIRegular">
				<span>
					<select
						(forEach)="secretsList" 
						(value)="selectedSecret"
						placeholder="Select API connection"
						>
						<option each="item" value="{item.name}">{item.name}</option>
					</select>
					<div class="input-endpoint-data">
						<p>
							<b>Host:</b> 
							<div style="color: rgb(32, 32, 107); padding-top: 3px; word-wrap: break-word;">@host</div>
						</p>
					</div>
					<div class="input-endpoint-data">
						<p><b>Total endpoints:</b> @totalEndpoints</p>
					</div>
				</span>
			</div>
		</span>
	</form>
</div>
<style>

	.parent-node .InputAPI { width: 200px; z-index: 1; }
	.input-endpoint-data { padding-top: 5px; }
	.copy-clipboard:hover { color: black; cursor: pointer; }

</style>
